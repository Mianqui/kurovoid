name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/mianqui/kurovoid:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Crear .env
        run: |
          cat > .env.production <<EOF
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=False
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
          DB_ENGINE=django.db.backends.postgresql
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=db
          DB_PORT=5432
          EMAIL_HOST=smtp.gmail.com
          EMAIL_PORT=587
          EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
          EMAIL_USE_TLS=True
          DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}
          SECURE_SSL_REDIRECT=False
          CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}
          EOF


      - name: Desplegar
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # Iniciar tunnel TCP en background
          cloudflared access tcp --hostname ${{ secrets.SERVER_SSH_HOST }} --url 127.0.0.1:2222 --id $CF_ACCESS_CLIENT_ID --secret $CF_ACCESS_CLIENT_SECRET &
          sleep 5

          COMMON_OPTS="-o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519"
          REMOTE="${{ secrets.DEPLOY_USER }}@127.0.0.1"

          ssh $COMMON_OPTS -p 2222 $REMOTE "mkdir -p ~/kurovoid"
          scp $COMMON_OPTS -P 2222 compose.yml $REMOTE:~/kurovoid/compose.yml
          scp $COMMON_OPTS -P 2222 .env.production $REMOTE:~/kurovoid/.env
          ssh $COMMON_OPTS -p 2222 $REMOTE "
            cd ~/kurovoid &&
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin &&
            docker-compose pull &&
            docker-compose up -d --remove-orphans &&
            docker-compose exec -T web python manage.py migrate &&
            docker image prune -f
          "
