{% extends 'dashboard/base_dashboard.html' %}
{% block title %}Configuración{% endblock %}

{% block content %}
<div class="px-4 sm:px-6 lg:px-8 py-8 w-full max-w-9xl mx-auto">
    <div class="sm:flex sm:justify-between sm:items-center mb-8">
        <div class="mb-4 sm:mb-0">
            <h1 class="text-2xl md:text-3xl font-bold">Configuración de Tienda ✨</h1>
        </div>
    </div>

    <div class="bg-white/5 border border-white/10 rounded-lg p-6">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Precio de Envío ($)</label>
                <input type="number" step="0.01" name="precio_envio" value="{{ form.precio_envio.value }}" class="form-input w-full bg-slate-800 border-white/10 text-white" />
            </div>
            
            
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Imagen de Fondo (Página Productos)</label>
                <input type="file" name="imagen_fondo_productos" class="form-input w-full bg-slate-800 border-white/10 text-white" />
                {% if form.instance.imagen_fondo_productos %}
                <p class="text-xs mt-1 text-slate-400">Actual: {{ form.instance.imagen_fondo_productos.name }}</p>
                {% endif %}
            </div>
<div class="mt-6 flex justify-end">
                <button type="submit" class="btn bg-indigo-500 hover:bg-indigo-600 text-white">Guardar Configuración</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
